<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoLeón - Reportar Fuga</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header class="main-header">
    <div class="logo-container">
      <h1>EcoLeón</h1>
    </div>
    <nav class="main-nav">
      <ul>
        <li><a href="dashboard.html">Panel</a></li>
        <li><a href="reportar-fuga.html" class="active">Reportar Fuga</a></li>
        <li><a href="historial.html">Historial</a></li>
        <li><a href="index.html">Cerrar Sesión</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="form-container">
      <h2>Reportar Incidencia de Agua</h2>
      <p style="margin-bottom: 1rem; color: var(--text-muted);">Completa el formulario para notificar a la red de soporte.</p>
      
      <form id="form-reporte">
        <div class="form-group">
          <label for="tipo-incidencia">Tipo de Incidencia</label>
          <select id="tipo-incidencia" name="tipo" required>
            <option value="">-- Selecciona una opción --</option>
            <option value="fuga_calle">Fuga en vía pública</option>
            <option value="sin_agua">Falla de suministro / Sin agua</option>
            <option value="desperdicio">Desperdicio comercial/particular</option>
            <option value="baja_presion">Baja presión severa</option>
          </select>
        </div>

        <div class="form-group">
          <label for="colonia">Colonia / Ubicación</label>
          <input type="text" id="colonia" name="colonia" placeholder="Ej. Jardines de Jerez" required>
        </div>

        <div class="form-group">
          <label for="descripcion">Descripción del problema</label>
          <textarea id="descripcion" name="descripcion" rows="4" placeholder="Describe brevemente la magnitud o referencia del problema..." required></textarea>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%;">Enviar Reporte</button>
      </form>
    </section>
  </main>

  <footer class="main-footer">
    <p>&copy; 2026 EcoLeón - Universidad Tecnológica de León</p>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
