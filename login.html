<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoLeón - Iniciar Sesión</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header class="main-header">
    <div class="logo-container">
      <h1>EcoLeón 💧</h1>
    </div>
    <nav class="main-nav">
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="login.html" class="active">Iniciar Sesión</a></li>
        <li><a href="registro.html">Registrarse</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="form-container">
      <h2>Acceso a la Plataforma</h2>
      <p style="margin-bottom: 1.5rem; color: var(--text-muted);">Ingresa tus credenciales para administrar tu cuenta de consumo de agua.</p>

      <form action="dashboard.html" method="GET">
        <div class="form-group">
          <label for="correo">Correo Electrónico</label>
          <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com" required>
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">Ingresar al Panel</button>
      </form>

      <p style="margin-top: 1.5rem; text-align: center; font-size: 0.9rem;">
        ¿Aún no tienes una cuenta? <a href="registro.html" style="color: var(--primary-color); font-weight: bold;">Regístrate aquí</a>
      </p>
    </section>
  </main>

  <footer class="main-footer">
    <p>&copy; 2026 EcoLeón - Universidad Tecnológica de León</p>
  </footer>

</body>
</html>
